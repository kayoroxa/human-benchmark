<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Regra oculta</title>
  <style>
    :root{color-scheme:light;--ink:#18222b;--paper:#edf2f3;--panel:#fff;--line:#c7d5d8;--muted:#637174;--accent:#246b72;--soft:#dcebed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{min-width:100vw;min-height:100dvh;background:var(--paper);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}main{height:100dvh;max-width:680px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:start;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.seed-control{min-height:0;padding:0;border:0;background:transparent;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}.overlay .seed-control{margin-top:8px;min-height:44px;padding:8px 14px;border:1px solid #c7d5d8;border-radius:10px;background:#fff;color:#173f43;font-size:14px}h1{margin:2px 0 0;font-size:clamp(23px,7vw,33px);letter-spacing:-.04em}.timer{font-size:25px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:11px}.label{display:block;margin-bottom:7px;color:var(--muted);font-size:12px;font-weight:750}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.example{min-height:50px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#f8fbfb;font-size:22px;font-weight:800;letter-spacing:5px}.case{height:min(26dvh,170px);display:grid;place-items:center;border:2px solid var(--accent);border-radius:14px;background:var(--soft);font-size:clamp(34px,12vw,56px);font-weight:850;letter-spacing:10px}.case-label{margin:0 0 8px;color:var(--muted);font-size:12px}.decision,.controls{display:grid;gap:8px}.decision{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr;margin-top:auto}button{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:750 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;touch-action:manipulation}button:hover,button:focus-visible{border-color:var(--accent);outline:2px solid #246b7240;outline-offset:1px}.accept{border-color:var(--accent);background:var(--accent);color:#fff}.result{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:#18222bf2;color:#fff}.overlay[hidden]{display:none}.modal{width:min(350px,100%);text-align:center}.modal h2{margin:0 0 8px;font-size:29px}.modal p{margin:0 0 22px;color:#dce7e7}.modal button{width:100%;min-height:62px;border:0;background:#dcebed;color:#173f43;font-size:19px}@media(max-height:640px){main{gap:7px;padding:8px}.case{height:130px}.example{min-height:42px}.panel{padding:8px}button{min-height:42px}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div><div class="eyebrow">Indução lógica · seed <span id="seed"></span> · <button id="seed-button" data-testid="seed-button" class="seed-control" type="button">abrir</button></div><h1>Regra oculta</h1></div><div id="timer" class="timer" aria-label="Tempo">00:00</div></header>
    <section class="panel" aria-label="Exemplos aceitos"><span class="label">Estes seis casos são aceitos</span><div id="examples" class="examples"></div></section>
    <section class="panel" id="challenge"><p id="case-counter" data-testid="case-counter" class="case-label">Caso 1 de 8</p><div id="case" class="case" aria-label="Caso a classificar"></div><div class="decision"><button id="accept-button" data-testid="accept-button" class="accept" type="button">Aceita</button><button id="reject-button" data-testid="reject-button" type="button">Recusa</button></div></section>
    <section id="result" data-testid="result" class="panel result hidden" aria-live="polite"></section>
    <nav class="controls" aria-label="Controles"><button id="reset-button" data-testid="reset-button" type="button">Reiniciar</button><button id="new-button" data-testid="new-button" type="button">Novo</button></nav>
  </main>
  <div id="overlay" class="overlay"><div class="modal"><h2>Regra oculta</h2><p>Descubra a relação entre quatro símbolos e classifique oito casos.</p><button id="start-button" data-testid="start-button" type="button">Iniciar</button><button class="tutorial-launch" data-tutorial-button data-testid="tutorial-button" type="button">Tutorial</button><button id="overlay-seed-button" data-testid="overlay-seed-button" class="seed-control" type="button">Abrir seed</button></div></div>
  <script src="../../benchmark-history.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const baseSymbols = ['●','▲','■','◆'];
      const parseSeed = () => {
        const value = Number.parseInt(new URLSearchParams(location.search).get('seed'), 10);
        return Number.isFinite(value) ? value >>> 0 : Math.floor(Math.random() * 0xffffffff);
      };
      let seed = parseSeed();
      let rule = 0, examples = [], cases = [], index = 0, correct = 0, startedAt = 0, timerId = 0, running = false;
      const format = ms => {
        const seconds = Math.floor(ms / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
      };
      const symbols = () => baseSymbols.map((_, i) => baseSymbols[(i + seed) % baseSymbols.length]);
      const text = values => values.map(value => symbols()[value]).join(' ');
      function makePuzzle() {
        rule = seed % 4;
        const predicates = [
          ([a,b,c,d]) => (a + b) % 4 === (c + d) % 4,
          ([a,b,c,d]) => (a + b + c + d) % 4 === 0,
          ([a,b,c,d]) => (a === c) !== (b === d),
          ([a,b,c,d]) => ((b - a + 4) % 4) === ((d - c + 4) % 4)
        ];
        const predicate = predicates[rule];
        const all = [];
        for (let a=0;a<4;a++) for(let b=0;b<4;b++) for(let c=0;c<4;c++) for(let d=0;d<4;d++) all.push([a,b,c,d]);
        let state = seed || 1;
        const shuffle = list => { const copy=list.slice(); for(let i=copy.length-1;i;i--){state=(state*1664525+1013904223)>>>0;const j=state%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]} return copy; };
        const accepted = shuffle(all.filter(predicate));
        const rejected = shuffle(all.filter(values => !predicate(values)));
        if (rule === 3 && accepted.slice(0,6).every(([a,b,c,d]) => b === a || c === a || d === a)) {
          const diagnosticIndex = accepted.findIndex(([a,b,c,d]) => b !== a && c !== a && d !== a);
          [accepted[5], accepted[diagnosticIndex]] = [accepted[diagnosticIndex], accepted[5]];
        }
        examples = accepted.slice(0,6).map(text);
        cases = shuffle([...accepted.slice(6,10).map(values=>({value:text(values),accepted:true})),...rejected.slice(0,4).map(values=>({value:text(values),accepted:false}))]);
      }
      function renderExamples() { $('examples').innerHTML = examples.map((value, i) => `<div class="example" aria-label="Exemplo aceito ${i + 1}: ${value}">${value}</div>`).join(''); }
      function renderCase() { const current = cases[index]; $('case').textContent = current.value; $('case').setAttribute('aria-label', `Caso ${index + 1}: ${current.value}`); $('case-counter').textContent = `Caso ${index + 1} de ${cases.length}`; }
      function stopTimer() { clearInterval(timerId); running = false; }
      function answer(choice) {
        if (!running) return;
        if (choice === cases[index].accepted) correct++;
        index++;
        if (index < cases.length) { renderCase(); return; }
        stopTimer();
        $('challenge').classList.add('hidden');
        $('result').classList.remove('hidden');
        $('result').innerHTML = `<strong>Resultado concluído</strong><br>Precisão: ${correct} de ${cases.length} · Tempo: ${$('timer').textContent}`;
        $('case-counter').textContent = 'Sessão concluída';
        BenchmarkHistory.save({ benchmark:'regra-oculta', name:'Regra oculta', seed, timeMs:performance.now()-startedAt, attempts:cases.length, metric:{ label:'Precisão média', value:correct/cases.length*100, suffix:'%', decimals:0 }, details:{ correct, total:cases.length } });
      }
      function reset() {
        stopTimer();
        index = 0; correct = 0;
        makePuzzle(); renderExamples(); renderCase();
        $('timer').textContent = '00:00';
        $('challenge').classList.remove('hidden');
        $('result').classList.add('hidden');
        $('overlay').hidden = false;
      }
      function start() {
        if (running) return;
        running = true; startedAt = performance.now();
        $('overlay').hidden = true;
        timerId = setInterval(() => { $('timer').textContent = format(performance.now() - startedAt); }, 200);
      }
      function newPuzzle() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        history.replaceState(null, '', `?seed=${seed}`);
        reset();
      }
      function openSeed() {
        const value = window.prompt('Digite uma seed de até 10 números.', seed);
        if (value === null) return;
        if (!/^\d{1,10}$/.test(value)) { $('case-counter').textContent = 'Seed inválida. Use de 1 a 10 números.'; return; }
        seed = Number(value) >>> 0;
        history.replaceState(null, '', `?seed=${seed}`);
        reset();
      }
      $('start-button').addEventListener('click', start);
      $('accept-button').addEventListener('click', () => answer(true));
      $('reject-button').addEventListener('click', () => answer(false));
      $('seed-button').addEventListener('click', openSeed);
      $('overlay-seed-button').addEventListener('click', openSeed);
      $('reset-button').addEventListener('click', reset);
      $('new-button').addEventListener('click', newPuzzle);
      reset();
    })();
  </script>
  <script src="../../tutorial.js"></script>
</body>
</html>
